<div class="chart-wrapper">
  <div class="chart-header">
    <div class="symbol-info">
      <app-symbol-selector (symbolChange)="onSymbolChange($event)" />
      <span class="symbol">{{ symbol() }}</span>
      <span class="price" [class.up]="priceChange() >= 0" [class.down]="priceChange() < 0">
        {{ currentPrice() | number:'1.2-2' }}
      </span>
      <span class="change" [class.up]="priceChange() >= 0" [class.down]="priceChange() < 0">
        {{ priceChange() >= 0 ? '+' : '' }}{{ priceChange() | number:'1.2-2' }}
      </span>
    </div>

    <mat-button-toggle-group
      [value]="timeframe()"
      (change)="onTimeframeChange($event.value)"
      class="tf-group"
    >
      @for (tf of timeframes; track tf) {
        <mat-button-toggle [value]="tf">{{ tf }}</mat-button-toggle>
      }
    </mat-button-toggle-group>
  </div>

  <div class="chart-canvas" #chartContainer>
    @if (loading()) {
      <div class="spinner-overlay">
        <mat-spinner diameter="32"></mat-spinner>
      </div>
    }
  </div>
</div>
