<div class="app-shell">
  <mat-toolbar color="primary" class="app-toolbar">
    <button mat-icon-button class="hamburger-btn" (click)="sidenav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="brand">AXIOM</span>
    <span class="brand-sub">trade testbed</span>
    <span class="toolbar-spacer"></span>
    <button mat-button class="lang-btn" [matMenuTriggerFor]="langMenu">
      <span class="fi" [class.fi-pl]="lang.currentLang() === 'pl'" [class.fi-gb]="lang.currentLang() === 'en'"></span>
      <span class="lang-code">{{ lang.currentLang() === 'pl' ? 'PL' : 'EN' }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #langMenu="matMenu" class="lang-menu-panel">
      <button mat-menu-item (click)="setLang('pl')">
        <span class="fi fi-pl lang-flag"></span>
        <span class="lang-name">POLSKI</span>
        <mat-icon class="lang-check" [style.visibility]="lang.currentLang() === 'pl' ? 'visible' : 'hidden'">check</mat-icon>
      </button>
      <button mat-menu-item (click)="setLang('en')">
        <span class="fi fi-gb lang-flag"></span>
        <span class="lang-name">ENGLISH</span>
        <mat-icon class="lang-check" [style.visibility]="lang.currentLang() === 'en' ? 'visible' : 'hidden'">check</mat-icon>
      </button>
    </mat-menu>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav
                 [mode]="isNarrow() ? 'over' : 'side'"
                 [opened]="!isNarrow()"
                 class="app-sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="/" routerLinkActive="active-nav-item" [routerLinkActiveOptions]="{ exact: true }"
           (click)="isNarrow() && sidenav.close()">
          <mat-icon matListItemIcon>bar_chart</mat-icon>
          <span matListItemTitle>{{ lang.t('nav.dashboard') }}</span>
        </a>
        <a mat-list-item routerLink="/strategy" routerLinkActive="active-nav-item"
           (click)="isNarrow() && sidenav.close()">
          <mat-icon matListItemIcon>account_tree</mat-icon>
          <span matListItemTitle>{{ lang.t('nav.strategy') }}</span>
        </a>
        @if (backtestStore.result() || backtestStore.history().length > 0) {
          <a mat-list-item routerLink="/statistics" routerLinkActive="active-nav-item"
             (click)="isNarrow() && sidenav.close()">
            <mat-icon matListItemIcon>insights</mat-icon>
            <span matListItemTitle>{{ lang.t('nav.statistics') }}</span>
          </a>
        }
        <a mat-list-item routerLink="/learn" routerLinkActive="active-nav-item"
           (click)="isNarrow() && sidenav.close()">
          <mat-icon matListItemIcon>school</mat-icon>
          <span matListItemTitle>{{ lang.t('nav.learn') }}</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <div class="main-content">
        <router-outlet />
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
